name: PlatformIO CI

permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'LICENSE'
      - 'README.md'
  push:
    branches:
      - master
      - 'feature/**'
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'LICENSE'
      - 'README.md'
  workflow_dispatch:

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
      - name: Run host tests
        run: pio test -e native

  firmware:
    name: Build firmware (esp32_dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'sdkconfig.defaults') }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
      - name: Build
        run: pio run -e esp32_dev
      - name: Check HAL boundary
        run: |
          # driver headers only in the port layer
          if grep -rn '#include.*driver/' main components | grep -v -e port_esp_idf -e components/libpax; then
            echo "driver/ header included outside components/port_esp_idf"; exit 1
          fi
          # every task pinned to a core
          if grep -rnE 'xTaskCreate\(' main components | grep -v components/libpax; then
            echo "use xTaskCreatePinnedToCore"; exit 1
          fi
