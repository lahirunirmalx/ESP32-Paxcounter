; ESP32-Paxcounter - native ESP-IDF build
;
; Layout:
;   main/                  app_main.cpp - boot + task supervisor
;   components/app_hal/    vendor-neutral peripheral interfaces (hal_*.h)
;   components/port_esp_idf/  the ONLY place driver/*.h is included
;   components/app_*/      one component per feature, one FreeRTOS task each
;   components/libpax/     vendored libpax (WiFi + BLE MAC counting)
;
; `pio run` builds the development env (unsigned, unencrypted, re-flashable).
; ESP-IDF dependencies belong in main/idf_component.yml, not lib_deps.

[platformio]
default_envs = esp32_dev
src_dir = main
description = Paxcounter counts nearby WiFi and BLE devices to estimate how many people are around.

[common]
; max. 10 chars, any decimal format like "a.b.c"
release_version = 4.0.0-dev

[env]
platform = espressif32@6.9.0
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; Global flags also compile ESP-IDF source - keep them lenient. Strict flags
; for application code are set per component in components/app_*/CMakeLists.txt.
build_flags =
    -Wall
    -Werror=return-type
    -Werror=implicit-fallthrough
    -Wno-error=format
    '-D PROGVERSION="${common.release_version}"'
    -D LIBPAX_ESPIDF=1
    -D LIBPAX_WIFI
    -D LIBPAX_BLE
    -D NO_BENCHMARK
; ESP-IDF 5.3 compiles C++ as gnu++2b by default.
board_build.partitions = partitions.csv

; ---- DEVELOPMENT (default) -------------------------------------------------
; Generic ESP32-WROOM-32 devkit (4 MB flash, no PSRAM).
; Size-optimized even in dev: BT controller + WiFi promiscuous mode leave
; little IRAM headroom on the classic ESP32.
[env:esp32_dev]
board = esp32dev
build_type = release
build_flags = ${env.build_flags} -D DEVELOPMENT_BUILD=1
board_build.sdkconfig_defaults = sdkconfig.defaults

; ---- HOST UNIT TESTS -------------------------------------------------------
; Pure-logic components (payload encoder, remote command parser, config
; validation) compiled for the host: `pio test -e native`
[env:native]
platform = native
framework =
test_framework = unity
build_src_filter = -<*>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -I components/app_payload/include
    -I components/app_rcmd/include
    -I components/app_config/include
    -I components/app_common/include
build_unflags =
board_build.partitions =
